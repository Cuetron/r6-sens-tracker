name: Sync Players to analyst copy

# Makes the "Players" table in the analyst database an exact mirror of prod.
# Every run replaces the copy's Players rows with prod's current rows, so any
# edits made to Players in the copy are overwritten. Prod is only ever READ
# (via the analyst_ro role).

on:
  schedule:
    - cron: '17 * * * *'   # every hour at :17 (UTC)
  workflow_dispatch:        # lets you run it manually from the Actions tab

concurrency:
  group: sync-players
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Postgres 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          # The runner ships Postgres 16 tools; make the 17 ones take priority
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Sync Players
        env:
          SRC: ${{ secrets.PROD_RO_URL }}
          DST: ${{ secrets.COPY_DB_URL }}
        run: |
          set -euo pipefail

          # 0. Mirror custom enum types (like "Sources") from prod into the copy.
          #    Runs every time so new enum values you add in prod carry over.
          #    "already exists" messages here are expected and harmless.
          psql "$SRC" -Atq -c "select distinct format('create type public.%I as enum ();', t.typname) from pg_type t join pg_enum e on e.enumtypid = t.oid where t.typnamespace = 'public'::regnamespace" > enum_types.sql
          psql "$SRC" -Atq -c "select format('alter type public.%I add value if not exists %L;', t.typname, e.enumlabel) from pg_type t join pg_enum e on e.enumtypid = t.oid where t.typnamespace = 'public'::regnamespace order by t.typname, e.enumsortorder" > enum_values.sql
          psql "$DST" -q -f enum_types.sql || true
          psql "$DST" -q -v ON_ERROR_STOP=1 -f enum_values.sql

          # 1. First run only: create the Players table in the copy
          EXISTS=$(psql "$DST" -Atc "select to_regclass('public.\"Players\"') is not null")
          if [ "$EXISTS" = "f" ]; then
            echo "Creating Players table in the copy..."
            # Prod's updated_at trigger uses the moddatetime extension
            psql "$DST" -q -v ON_ERROR_STOP=1 -c 'create extension if not exists moddatetime with schema extensions'
            # --single-transaction: if anything fails, no half-built table is left behind
            # grep -v: skip the prod-only analyst_ro policy (that role doesn't exist in the copy)
            pg_dump "$SRC" --schema-only --no-owner --no-privileges -t 'public."Players"' \
              | grep -v 'analyst_ro' \
              | psql "$DST" -v ON_ERROR_STOP=1 --single-transaction
          fi

          # 2. Safety check: never wipe the copy if prod returns nothing
          COUNT=$(psql "$SRC" -Atc 'select count(*) from public."Players"')
          echo "Prod Players rows: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "Source returned 0 rows (is an RLS policy missing for analyst_ro?). Aborting."
            exit 1
          fi

          # 3. Export from prod (read-only)
          psql "$SRC" -v ON_ERROR_STOP=1 \
            -c '\copy (select * from public."Players") to players.csv csv header'

          # 4. Replace the copy's rows with prod's, all-or-nothing in one transaction
          psql "$DST" -v ON_ERROR_STOP=1 --single-transaction <<'SQL'
          delete from public."Players";
          \copy public."Players" from 'players.csv' csv header
          select setval(
            pg_get_serial_sequence('public."Players"', 'id'),
            (select coalesce(max(id), 1) from public."Players")
          );
          SQL

          echo "Sync complete."
